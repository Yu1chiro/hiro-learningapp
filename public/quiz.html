<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz — JLPT N3 Learning OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ display:['"Zen Maru Gothic"','sans-serif'], sans:['Inter','sans-serif'] },
    colors:{ primary:{50:'#eef4ff',100:'#dbe7ff',200:'#bcd3ff',300:'#8fb6ff',400:'#5c8fff',500:'#4c7cf3',600:'#3860d6',700:'#2d4bab',800:'#283f89',900:'#25386f'} },
    boxShadow:{ soft:'0 20px 45px -15px rgba(76,124,243,0.30)', softer:'0 4px 20px -4px rgba(76,124,243,0.15)' },
  }}};
</script>
<style>
  body{font-family:'Inter',sans-serif;}
  .font-display{font-family:'Zen Maru Gothic',sans-serif;}
  .bg-app{background:radial-gradient(circle at 10% 0%,#eaf1ff 0%,transparent 40%),radial-gradient(circle at 90% 100%,#eef9f5 0%,transparent 35%),linear-gradient(180deg,#f5f8ff 0%,#ffffff 55%);}
  .dark .bg-app{background:radial-gradient(circle at 10% 0%,#101a30 0%,transparent 40%),radial-gradient(circle at 90% 100%,#0e1e1c 0%,transparent 35%),linear-gradient(180deg,#0a0f1c 0%,#0b1220 55%);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
  @keyframes toast-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateY(6px)}}
  .toast-enter{animation:toast-in .22s ease-out} .toast-exit{animation:toast-out .18s ease-in forwards}
  @keyframes q-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
  .q-enter{animation:q-in .22s ease-out}
  .safe-bottom{padding-bottom:max(0.5rem, env(safe-area-inset-bottom));}
  .nav-active{color:#4c7cf3 !important;}
  .skeleton{background:linear-gradient(90deg,rgba(148,163,184,.15) 25%,rgba(148,163,184,.3) 37%,rgba(148,163,184,.15) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .opt-btn{transition:all .15s ease;}
  .opt-btn:active{transform:scale(.98);}
  .opt-selected{border-color:#4c7cf3 !important;background:#eef4ff !important;color:#2d4bab !important;}
  .dark .opt-selected{background:rgba(76,124,243,.18) !important;color:#8fb6ff !important;}
  .opt-correct{border-color:#10b981 !important;background:#ecfdf5 !important;color:#047857 !important;}
  .dark .opt-correct{background:rgba(16,185,129,.15) !important;color:#34d399 !important;}
  .opt-wrong{border-color:#f43f5e !important;background:#fff1f2 !important;color:#be123c !important;}
  .dark .opt-wrong{background:rgba(244,63,94,.15) !important;color:#fb7185 !important;}
  .progress-bar{transition:width .3s ease;}
</style>
</head>
<body class="bg-app min-h-screen text-slate-800 dark:text-slate-100 antialiased pb-28">

  <header class="sticky top-0 z-20 bg-white/70 dark:bg-slate-900/70 backdrop-blur border-b border-white/60 dark:border-slate-800 px-4 sm:px-6 py-3 flex items-center justify-between">
    <a href="/index.html" id="headerBack" class="flex items-center gap-2.5">
      <div class="h-9 w-9 rounded-xl bg-primary-500 text-white flex items-center justify-center shadow-softer"><i class="fa-solid fa-pen-to-square"></i></div>
      <span class="font-display font-bold text-lg">Quiz</span>
    </a>
    <button id="themeToggle" aria-label="Ganti tema" class="h-9 w-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-primary-600 dark:text-primary-300">
      <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
    </button>
  </header>

  <main class="max-w-2xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Lesson picker (no lesson_id in URL) -->
    <div id="lessonPicker" class="hidden">
      <h1 class="font-display text-xl font-bold mb-1">Mulai Quiz</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Pilih lesson yang mau kamu uji.</p>
      <div id="lessonPickerList" class="grid sm:grid-cols-2 gap-3"></div>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="space-y-3">
      <div class="skeleton h-6 w-1/2 rounded-lg"></div>
      <div class="skeleton h-56 rounded-2xl"></div>
    </div>

    <!-- Error -->
    <div id="errorState" class="hidden text-center py-16">
      <i class="fa-regular fa-face-frown text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
      <p id="errorMessage" class="text-slate-500 dark:text-slate-400 mb-4">Terjadi kesalahan.</p>
      <a href="/study.html" class="inline-flex items-center gap-2 text-primary-600 dark:text-primary-400 font-semibold hover:underline"><i class="fa-solid fa-arrow-left"></i> Kembali ke Study</a>
    </div>

    <!-- Quiz runner -->
    <section id="quizRunner" class="hidden space-y-5">
      <div>
        <div class="flex items-center justify-between text-sm mb-2">
          <span id="lessonTitleLabel" class="font-display font-bold"></span>
          <span id="progressLabel" class="text-slate-400"></span>
        </div>
        <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
          <div id="progressBar" class="progress-bar h-full bg-primary-500" style="width:0%"></div>
        </div>
      </div>

      <div id="questionCard" class="q-enter rounded-3xl bg-white dark:bg-slate-800 shadow-soft p-5 sm:p-6 space-y-5">
        <div class="flex items-center gap-2 flex-wrap">
          <span id="qContentType" class="text-[10px] uppercase tracking-wide font-bold px-2 py-1 rounded-full bg-primary-50 dark:bg-primary-900/40 text-primary-600 dark:text-primary-300"></span>
          <span id="qDifficulty" class="text-[10px] uppercase tracking-wide font-bold px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300"></span>
        </div>
        <p id="questionText" class="font-display text-lg sm:text-xl font-bold leading-relaxed"></p>
        <div id="optionsList" class="space-y-3"></div>
      </div>

      <button id="nextBtn" disabled
        class="w-full rounded-2xl bg-primary-500 hover:bg-primary-600 disabled:bg-slate-300 dark:disabled:bg-slate-700 disabled:cursor-not-allowed text-white font-display font-bold py-4 shadow-soft transition flex items-center justify-center gap-2 text-lg">
        <span id="nextBtnLabel">Berikutnya</span> <i class="fa-solid fa-arrow-right"></i>
      </button>
    </section>

    <!-- Result -->
    <section id="resultView" class="hidden space-y-6">
      <div class="text-center">
        <div class="mx-auto mb-3 h-16 w-16 rounded-2xl bg-primary-500 text-white flex items-center justify-center shadow-soft text-2xl">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h1 class="font-display text-2xl font-bold">Quiz Selesai!</h1>
        <p id="resultLessonTitle" class="text-slate-500 dark:text-slate-400 text-sm mt-1"></p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 text-center">
          <p class="text-xs text-slate-400 mb-1">Accuracy</p>
          <p id="resAccuracy" class="font-display text-3xl font-bold text-primary-600 dark:text-primary-400">-</p>
        </div>
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 text-center">
          <p class="text-xs text-slate-400 mb-1">Score</p>
          <p id="resScore" class="font-display text-3xl font-bold">-</p>
        </div>
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 text-center">
          <p class="text-xs text-slate-400 mb-1">Correct / Wrong</p>
          <p id="resCorrectWrong" class="font-display text-xl font-bold"><span class="text-emerald-500">-</span> / <span class="text-rose-500">-</span></p>
        </div>
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 text-center">
          <p class="text-xs text-slate-400 mb-1">Avg Response</p>
          <p id="resAvgTime" class="font-display text-xl font-bold">-</p>
        </div>
      </div>

      <div>
        <h2 class="font-display font-bold text-lg mb-3">Breakdown</h2>
        <div id="resBreakdown" class="grid grid-cols-3 gap-3"></div>
      </div>

      <div id="resMistakesWrap" class="hidden">
        <h2 class="font-display font-bold text-lg mb-3 flex items-center gap-2"><i class="fa-solid fa-circle-exclamation text-rose-500"></i> Review Jawaban Salah</h2>
        <div id="resMistakesList" class="space-y-3"></div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <a href="/index.html" class="text-center rounded-2xl border border-slate-200 dark:border-slate-700 font-semibold py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800 transition"><i class="fa-solid fa-house"></i> Home</a>
        <a id="retryLink" href="#" class="text-center rounded-2xl bg-primary-500 hover:bg-primary-600 text-white font-semibold py-3.5 shadow-soft transition"><i class="fa-solid fa-rotate-right"></i> Quiz Lagi</a>
      </div>
    </section>
  </main>

  <nav aria-label="Navigasi utama" class="fixed bottom-0 inset-x-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-t border-slate-200 dark:border-slate-800 safe-bottom">
    <div class="max-w-3xl mx-auto grid grid-cols-5">
      <a href="/index.html" data-page="home" class="nav-link flex flex-col items-center justify-center gap-1 py-2.5 text-slate-400 transition"><i class="fa-solid fa-house text-lg"></i><span class="text-[11px] font-medium">Home</span></a>
      <a href="/study.html" data-page="study" class="nav-link flex flex-col items-center justify-center gap-1 py-2.5 text-slate-400 transition"><i class="fa-solid fa-book-open text-lg"></i><span class="text-[11px] font-medium">Study</span></a>
      <a href="/quiz.html" data-page="quiz" class="nav-link flex flex-col items-center justify-center gap-1 py-2.5 text-slate-400 transition"><i class="fa-solid fa-pen-to-square text-lg"></i><span class="text-[11px] font-medium">Quiz</span></a>
      <a href="/admin.html?section=statistics" data-page="progress" class="nav-link flex flex-col items-center justify-center gap-1 py-2.5 text-slate-400 transition"><i class="fa-solid fa-chart-line text-lg"></i><span class="text-[11px] font-medium">Progress</span></a>
      <a href="/admin.html" data-page="admin" class="nav-link flex flex-col items-center justify-center gap-1 py-2.5 text-slate-400 transition"><i class="fa-solid fa-user-shield text-lg"></i><span class="text-[11px] font-medium">Admin</span></a>
    </div>
  </nav>

  <div id="toastContainer" aria-live="polite" class="fixed bottom-24 right-4 left-4 sm:left-auto z-50 flex flex-col gap-2 items-stretch sm:items-end"></div>

<script>
  document.querySelectorAll('[data-page="quiz"]').forEach(el => el.classList.add('nav-active'));
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark');
  document.getElementById('themeToggle').addEventListener('click', () => { root.classList.toggle('dark'); localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light'); });

  function showToast(message, type = 'info') {
    const icons = { success:'fa-circle-check', error:'fa-circle-exclamation', warning:'fa-triangle-exclamation', info:'fa-circle-info' };
    const colors = { success:'border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300', error:'border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300', warning:'border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-300', info:'border-primary-200 dark:border-primary-800 text-primary-700 dark:text-primary-300' };
    const el = document.createElement('div');
    el.setAttribute('role', 'status');
    el.className = `toast-enter max-w-sm w-full sm:w-96 bg-white dark:bg-slate-800 border ${colors[type]||colors.info} rounded-xl shadow-soft px-4 py-3 flex items-start gap-3`;
    el.innerHTML = `<i class="fa-solid ${icons[type]||icons.info} mt-0.5"></i><p class="text-sm flex-1 text-slate-700 dark:text-slate-200">${message}</p><button aria-label="Tutup" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>`;
    let dismissed = false;
    const dismiss = () => { if (dismissed) return; dismissed = true; el.classList.remove('toast-enter'); el.classList.add('toast-exit'); setTimeout(()=>el.remove(),200); };
    el.querySelector('button').addEventListener('click', dismiss);
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(dismiss, 4200);
  }

  async function api(path, options = {}) {
    const res = await fetch('/api' + path, { credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...options });
    if (res.status === 401) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('unauthorized'); }
    let body = {}; try { body = await res.json(); } catch(e){}
    if (!res.ok || !body.success) { const err = new Error(body.message || 'Terjadi kesalahan'); err.status = res.status; throw err; }
    return body.data;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const CONTENT_LABELS = { grammar: 'Grammar', vocabulary: 'Vocabulary', kanji: 'Kanji' };
  const DIFF_LABELS = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

  const params = new URLSearchParams(location.search);
  const lessonId = params.get('lesson_id');

  function show(id) {
    ['lessonPicker','loadingState','errorState','quizRunner','resultView'].forEach(x =>
      document.getElementById(x).classList.toggle('hidden', x !== id));
  }

  function showError(message) {
    show('errorState');
    document.getElementById('errorMessage').textContent = message;
  }

  // --- Quiz state ---
  let quizSessionId = null;
  let questions = [];
  let current = 0;
  let selectedKey = null;
  let questionStartedAt = 0;
  const answers = []; // {question_id, selected_answer, response_time}
  let submitting = false;

  async function loadLessonPicker() {
    show('lessonPicker');
    try {
      const lessons = await api('/lessons');
      const el = document.getElementById('lessonPickerList');
      el.innerHTML = lessons.length ? lessons.map(l => `
        <a href="/quiz.html?lesson_id=${l.id}" class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 block hover:shadow-soft transition">
          <p class="font-display font-bold">${escapeHtml(l.title)}</p>
          ${l.description ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${escapeHtml(l.description)}</p>` : ''}
          <span class="inline-flex items-center gap-1 mt-2 text-xs font-semibold text-primary-600 dark:text-primary-400"><i class="fa-solid fa-bolt"></i> Mulai Quiz</span>
        </a>`).join('') : '<p class="text-slate-400 text-sm col-span-full">Belum ada lesson. Buat dulu di halaman Admin.</p>';
    } catch (e) {
      showError('Gagal memuat daftar lesson.');
    }
  }

  function renderQuestion() {
    const q = questions[current];
    document.getElementById('lessonTitleLabel').textContent = window.__lessonTitle || '';
    document.getElementById('progressLabel').textContent = `${current + 1} / ${questions.length}`;
    document.getElementById('progressBar').style.width = `${Math.round((current) / questions.length * 100)}%`;
    document.getElementById('qContentType').textContent = CONTENT_LABELS[q.content_type] || q.content_type;
    document.getElementById('qDifficulty').textContent = DIFF_LABELS[q.difficulty] || q.difficulty;
    document.getElementById('questionText').textContent = q.question_text;

    const opts = [['a', q.option_a], ['b', q.option_b], ['c', q.option_c], ['d', q.option_d]];
    const list = document.getElementById('optionsList');
    list.innerHTML = opts.map(([key, text]) => `
      <button type="button" data-key="${key}"
        class="opt-btn w-full text-left rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40 px-4 py-3.5 flex items-center gap-3">
        <span class="h-7 w-7 shrink-0 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center text-xs font-bold uppercase">${key}</span>
        <span class="text-sm sm:text-base">${escapeHtml(text)}</span>
      </button>`).join('');

    list.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedKey = btn.dataset.key;
        list.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('opt-selected'));
        btn.classList.add('opt-selected');
        document.getElementById('nextBtn').disabled = false;
      });
    });

    selectedKey = null;
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtnLabel').textContent = (current === questions.length - 1) ? 'Submit Quiz' : 'Berikutnya';
    questionStartedAt = Date.now();

    const card = document.getElementById('questionCard');
    card.classList.remove('q-enter'); void card.offsetWidth; card.classList.add('q-enter');
  }

  function guardClick(button, fn) {
    return async () => {
      if (button.dataset.busy === '1') return;
      button.dataset.busy = '1';
      try { await fn(); } finally { button.dataset.busy = '0'; }
    };
  }

  document.getElementById('nextBtn').addEventListener('click', guardClick(document.getElementById('nextBtn'), async () => {
    if (!selectedKey) return;
    const q = questions[current];
    const responseTime = Date.now() - questionStartedAt;
    answers.push({ question_id: q.id, selected_answer: selectedKey, response_time: responseTime });

    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      document.getElementById('progressBar').style.width = '100%';
      await submitQuiz();
    }
  }));

  async function submitQuiz() {
    if (submitting) return;
    submitting = true;
    const btn = document.getElementById('nextBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Menghitung hasil...</span>';
    try {
      const result = await api('/quiz/submit', {
        method: 'POST',
        body: JSON.stringify({ quiz_session_id: quizSessionId, answers }),
      });
      renderResult(result);
    } catch (e) {
      showToast(e.message || 'Gagal submit quiz', 'error');
      btn.disabled = false;
      btn.innerHTML = '<span>Submit Quiz</span> <i class="fa-solid fa-arrow-right"></i>';
      submitting = false;
    }
  }

  function fmtMs(ms) {
    if (!ms && ms !== 0) return '-';
    if (ms < 1000) return `${ms} ms`;
    return `${(ms / 1000).toFixed(1)} s`;
  }

  function renderResult(result) {
    show('resultView');
    const { session, breakdown, attempts } = result;
    document.getElementById('resultLessonTitle').textContent = session.lesson_title;
    document.getElementById('resAccuracy').textContent = `${session.accuracy}%`;
    document.getElementById('resScore').textContent = session.score;
    document.getElementById('resCorrectWrong').innerHTML = `<span class="text-emerald-500">${session.correct_count}</span> / <span class="text-rose-500">${session.wrong_count}</span>`;
    document.getElementById('resAvgTime').textContent = fmtMs(session.avg_response_time_ms);

    const bd = document.getElementById('resBreakdown');
    bd.innerHTML = ['grammar', 'vocabulary', 'kanji'].map(type => {
      const d = breakdown[type];
      return `
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-3 text-center">
          <p class="text-[11px] uppercase tracking-wide text-slate-400 mb-1">${CONTENT_LABELS[type]}</p>
          <p class="font-display text-xl font-bold ${d.accuracy === null ? 'text-slate-300 dark:text-slate-600' : 'text-primary-600 dark:text-primary-400'}">${d.accuracy === null ? '-' : d.accuracy + '%'}</p>
          <p class="text-[11px] text-slate-400 mt-0.5">${d.correct}/${d.total}</p>
        </div>`;
    }).join('');

    const wrongAttempts = attempts.filter(a => !a.is_correct);
    if (wrongAttempts.length) {
      document.getElementById('resMistakesWrap').classList.remove('hidden');
      document.getElementById('resMistakesList').innerHTML = wrongAttempts.map(a => `
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4">
          <p class="text-sm font-semibold mb-2">${escapeHtml(a.question_text)}</p>
          <div class="grid grid-cols-1 gap-1.5 text-sm mb-2">
            ${['a','b','c','d'].map(k => `
              <div class="rounded-lg px-3 py-1.5 border ${k === a.correct_answer ? 'border-emerald-300 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-300' : (k === a.selected_answer ? 'border-rose-300 bg-rose-50 dark:bg-rose-950/30 text-rose-700 dark:text-rose-300' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400')}">
                <span class="font-bold uppercase mr-1">${k}.</span> ${escapeHtml(a.options[k])}
                ${k === a.correct_answer ? ' <i class="fa-solid fa-circle-check"></i>' : (k === a.selected_answer ? ' <i class="fa-solid fa-circle-xmark"></i>' : '')}
              </div>`).join('')}
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400"><i class="fa-solid fa-lightbulb text-amber-400"></i> ${escapeHtml(a.explanation)}</p>
        </div>`).join('');
    }

    document.getElementById('retryLink').href = `/quiz.html?lesson_id=${session.lesson_id}`;
  }

  async function startQuiz() {
    show('loadingState');
    try {
      const data = await api(`/quiz/${lessonId}`);
      quizSessionId = data.quiz_session_id;
      questions = data.questions;
      window.__lessonTitle = data.lesson.title;
      current = 0;
      answers.length = 0;
      show('quizRunner');
      renderQuestion();
    } catch (e) {
      showError(e.message || 'Gagal memuat quiz.');
    }
  }

  async function init() {
    try { await api('/auth/me'); } catch (e) { return; }
    if (!lessonId) { await loadLessonPicker(); return; }
    await startQuiz();
  }

  init();
</script>
</body>
</html>
