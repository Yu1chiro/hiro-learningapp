<script>
document.querySelectorAll('[data-page="admin"]').forEach(el => el.classList.add('nav-active'));
const root = document.documentElement;
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark');
document.getElementById('themeToggle').addEventListener('click', () => {
  root.classList.toggle('dark');
  localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
});

// ---------- Toast ----------
function showToast(message, type = 'info') {
  const icons = { success:'fa-circle-check', error:'fa-circle-exclamation', warning:'fa-triangle-exclamation', info:'fa-circle-info' };
  const colors = { success:'border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300', error:'border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300', warning:'border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-300', info:'border-primary-200 dark:border-primary-800 text-primary-700 dark:text-primary-300' };
  const el = document.createElement('div');
  el.setAttribute('role', 'status');
  el.className = `toast-enter max-w-sm w-full sm:w-96 bg-white dark:bg-slate-800 border ${colors[type]||colors.info} rounded-xl shadow-soft px-4 py-3 flex items-start gap-3`;
  el.innerHTML = `<i class="fa-solid ${icons[type]||icons.info} mt-0.5"></i><p class="text-sm flex-1 text-slate-700 dark:text-slate-200">${message}</p><button aria-label="Tutup" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>`;
  let dismissed = false;
  const dismiss = () => { if (dismissed) return; dismissed = true; el.classList.remove('toast-enter'); el.classList.add('toast-exit'); setTimeout(()=>el.remove(),200); };
  el.querySelector('button').addEventListener('click', dismiss);
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(dismiss, 4200);
}

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch('/api' + path, { credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...options });
  if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('unauthorized'); }
  let body = {}; try { body = await res.json(); } catch(e){}
  if (!res.ok || !body.success) { const err = new Error(body.message || 'Terjadi kesalahan'); err.status = res.status; err.details = body.details; throw err; }
  return body.data;
}

function escapeHtml(str) { return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : '-'; }

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await api('/auth/logout', { method: 'POST' }); } catch(e){}
  location.href = '/login';
});

// ---------- Double-submit guard ----------
function guardSubmit(button, fn) {
  return async (...args) => {
    if (button.dataset.busy === '1') return;
    button.dataset.busy = '1';
    button.disabled = true;
    const original = button.innerHTML;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Memproses...</span>';
    try { await fn(...args); }
    finally { button.dataset.busy = '0'; button.disabled = false; button.innerHTML = original; }
  };
}

// ---------- Modal ----------
function openModal(title, bodyHtml) {
  document.getElementById('modalTitle').innerHTML = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.body.classList.add('overflow-hidden');
  setTimeout(() => { const f = document.querySelector('#modalBody input, #modalBody textarea, #modalBody select'); if (f) f.focus(); }, 60);
}
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.body.classList.remove('overflow-hidden');
  document.getElementById('modalBody').innerHTML = '';
}
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('modalOverlay').classList.contains('hidden')) closeModal(); });

function confirmDelete(message, onConfirm) {
  openModal('Konfirmasi Hapus', `
    <p class="text-sm text-slate-600 dark:text-slate-300 mb-5">${escapeHtml(message)}</p>
    <div class="grid grid-cols-2 gap-3">
      <button id="cdCancel" type="button" class="rounded-xl border border-slate-200 dark:border-slate-700 font-semibold py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700 transition">Batal</button>
      <button id="cdConfirm" type="button" class="rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 transition">Hapus</button>
    </div>`);
  document.getElementById('cdCancel').addEventListener('click', closeModal);
  document.getElementById('cdConfirm').addEventListener('click', guardSubmit(document.getElementById('cdConfirm'), async () => {
    try { await onConfirm(); closeModal(); } catch (e) { showToast(e.message || 'Gagal menghapus', 'error'); }
  }));
}

function loadingSkeleton() {
  return `<div class="space-y-3"><div class="skeleton h-8 w-1/3 rounded-lg"></div><div class="skeleton h-24 rounded-2xl"></div><div class="skeleton h-24 rounded-2xl"></div></div>`;
}
function errorBlock(message) {
  return `<div class="text-center py-16"><i class="fa-regular fa-face-frown text-4xl text-slate-300 dark:text-slate-600 mb-3"></i><p class="text-slate-500 dark:text-slate-400">${escapeHtml(message)}</p></div>`;
}
function emptyBlock(message, icon = 'fa-inbox') {
  return `<div class="text-center py-14 text-slate-400"><i class="fa-solid ${icon} text-3xl mb-2"></i><p class="text-sm">${escapeHtml(message)}</p></div>`;
}

// =========================================================
// ROUTER
// =========================================================
const SECTIONS = [
  { key:'dashboard', label:'Dashboard', icon:'fa-gauge-high' },
  { key:'lessons', label:'Lessons', icon:'fa-book' },
  { key:'materials', label:'Materials', icon:'fa-file-lines' },
  { key:'grammar', label:'Grammar', icon:'fa-diagram-project' },
  { key:'vocabulary', label:'Vocabulary', icon:'fa-spell-check' },
  { key:'kanji', label:'Kanji', icon:'fa-language' },
  { key:'questions', label:'Questions', icon:'fa-circle-question' },
  { key:'import', label:'Import', icon:'fa-file-import' },
  { key:'statistics', label:'Statistics', icon:'fa-chart-line' },
];
const SECTION_KEYS = SECTIONS.map(s => s.key);

function currentSection() {
  const s = new URLSearchParams(location.search).get('section');
  return SECTION_KEYS.includes(s) ? s : 'dashboard';
}

function renderTabs(active) {
  document.getElementById('sectionTabs').innerHTML = SECTIONS.map(s => `
    <button data-section="${s.key}" class="section-tab ${s.key === active ? 'tab-active' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300'} rounded-full px-3.5 py-1.5 text-sm font-semibold flex items-center gap-1.5 transition">
      <i class="fa-solid ${s.icon} text-xs"></i> ${s.label}
    </button>`).join('');
  document.querySelectorAll('.section-tab').forEach(btn => btn.addEventListener('click', () => navigateSection(btn.dataset.section)));
}

function navigateSection(section, push = true) {
  if (push) history.pushState({ section }, '', `/admin?section=${section}`);
  renderTabs(section);
  renderSection(section);
}

window.addEventListener('popstate', () => {
  const s = currentSection();
  renderTabs(s);
  renderSection(s);
});

async function renderSection(section) {
  const el = document.getElementById('sectionContent');
  el.innerHTML = loadingSkeleton();
  try {
    if (section === 'dashboard') await renderDashboard(el);
    else if (section === 'lessons') await renderLessons(el);
    else if (section === 'materials') await renderMaterials(el);
    else if (['grammar','vocabulary','kanji'].includes(section)) await renderContentType(el, section);
    else if (section === 'questions') await renderQuestions(el);
    else if (section === 'import') await renderImport(el);
    else if (section === 'statistics') await renderStatistics(el);
  } catch (e) {
    el.innerHTML = errorBlock(e.message || 'Gagal memuat data');
  }
}

// ---------- Shared lesson cache ----------
let lessonsCache = null;
async function getLessons(force = false) {
  if (lessonsCache && !force) return lessonsCache;
  lessonsCache = await api('/lessons');
  return lessonsCache;
}

function lessonSelectOptions(lessons, selectedId) {
  return lessons.map(l => `<option value="${l.id}" ${String(l.id) === String(selectedId) ? 'selected' : ''}>${escapeHtml(l.title)}</option>`).join('');
}

// DASHBOARD
// =========================================================
async function renderDashboard(el) {
  const [lessons, materials, grammar, vocabulary, kanji, questions, mistakes] = await Promise.all([
    getLessons(true), api('/materials'), api('/grammar'), api('/vocabulary'), api('/kanji'), api('/questions'), api('/mistakes'),
  ]);

    { label: 'Study Materials', value: materials.length, icon: 'fa-file-lines' },
    { label: 'Grammar', value: grammar.length, icon: 'fa-diagram-project' },
    { label: 'Vocabulary', value: vocabulary.length, icon: 'fa-spell-check' },
    { label: 'Kanji', value: kanji.length, icon: 'fa-language' },
    { label: 'Questions', value: questions.length, icon: 'fa-circle-question' },
  ];
  const latestLessons = lessons.slice(0, 5);
  const latestQuestions = questions.slice(0, 5);
  const recentMistakes = mistakes.slice(0, 5);

  el.innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
      ${cards.map(c => `
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4">
          <div class="h-9 w-9 rounded-xl bg-primary-50 dark:bg-primary-900/40 text-primary-600 dark:text-primary-300 flex items-center justify-center mb-2"><i class="fa-solid ${c.icon}"></i></div>
          <p class="font-display text-2xl font-bold">${c.value}</p>
          <p class="text-xs text-slate-400">${c.label}</p>
        </div>`).join('')}
    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1">
        <h2 class="font-display font-bold text-lg mb-3">Latest Lessons</h2>
        <div class="space-y-2">
          ${latestLessons.length ? latestLessons.map(l => `
            <div class="rounded-xl bg-white dark:bg-slate-800 shadow-softer p-3">
              <p class="font-semibold text-sm">${escapeHtml(l.title)}</p>
              <p class="text-xs text-slate-400">${fmtDate(l.study_date)}</p>
            </div>`).join('') : emptyBlock('Belum ada lesson')}
        </div>
      </div>
      <div class="lg:col-span-1">
        <h2 class="font-display font-bold text-lg mb-3">Latest Questions</h2>
        <div class="space-y-2">
          ${latestQuestions.length ? latestQuestions.map(q => `
            <div class="rounded-xl bg-white dark:bg-slate-800 shadow-softer p-3">
              <p class="text-sm line-clamp-2">${escapeHtml(q.question_text)}</p>
              <span class="badge bg-primary-50 dark:bg-primary-900/40 text-primary-600 dark:text-primary-300 mt-1">${q.content_type}</span>
            </div>`).join('') : emptyBlock('Belum ada question')}
        </div>
      </div>
      <div class="lg:col-span-1">
        <h2 class="font-display font-bold text-lg mb-3">Recent Mistakes</h2>
        <div class="space-y-2">
          ${recentMistakes.length ? recentMistakes.map(m => `
            <div class="rounded-xl bg-white dark:bg-slate-800 shadow-softer p-3">
              <p class="text-sm line-clamp-2">${escapeHtml(m.question_text)}</p>
              <p class="text-xs text-rose-500 mt-1">Salah: ${m.wrong_answer.toUpperCase()} | Benar: ${m.correct_answer.toUpperCase()}</p>
            </div>`).join('') : emptyBlock('Belum ada kesalahan tercatat', 'fa-face-smile')}
        </div>
      </div>
    </div>`;
}

    </div>

      ${lessons.length ? lessons.map(l => lessonCard(l)).join('') : emptyBlock('Belum ada lesson. Klik "+ Lesson" untuk membuat.')}
    </div>`;
  
  document.getElementById('addLessonBtn').addEventListener('click', () => openLessonForm());
  bindLessonCardEvents();
}

function lessonCard(l) {
  // FITUR BARU: Tambahan tombol download / export ke format JSON
  return `
    <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4" data-id="${l.id}">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p class="font-display font-bold">${escapeHtml(l.title)}</p>
          <p class="text-xs text-slate-400 mt-0.5"><i class="fa-regular fa-calendar"></i> ${fmtDate(l.study_date)}</p>
          ${l.description ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-2 line-clamp-2">${escapeHtml(l.description)}</p>` : ''}
        </div>
        <div class="flex gap-1 shrink-0">
          <button data-export="${l.id}" aria-label="Export JSON" title="Download data lesson untuk AI Prompting" class="h-8 w-8 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 flex items-center justify-center text-emerald-600 dark:text-emerald-400"><i class="fa-solid fa-download text-xs"></i></button>
          <button data-edit="${l.id}" aria-label="Edit" class="h-8 w-8 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300"><i class="fa-solid fa-pen text-xs"></i></button>
          <button data-del="${l.id}" aria-label="Hapus" class="h-8 w-8 rounded-lg bg-rose-50 dark:bg-rose-950/40 flex items-center justify-center text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
        </div>

function bindLessonCardEvents() {
  document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', async () => {
    const lessons = await getLessons();
    openLessonForm(lessons.find(l => String(l.id) === btn.dataset.edit));
  }));
  document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
    confirmDelete('Lesson beserta seluruh material, grammar, vocabulary, kanji, dan question di dalamnya akan terhapus permanen. Lanjutkan?', async () => {
      await api(`/lessons/${btn.dataset.del}`, { method: 'DELETE' });
      showToast('Lesson berhasil dihapus', 'success');
      renderSection('lessons');
    });
  }));

  // FITUR BARU: Logic saat tombol download/export JSON diklik
  document.querySelectorAll('[data-export]').forEach(btn => btn.addEventListener('click', async () => {
    const lessonId = btn.dataset.export;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i>';
    btn.disabled = true;
    
    try {
      // 1. Ambil seluruh data dari endpoint backend
      const data = await api(`/lessons/${lessonId}/export`);
      
      // 2. Buat objek JSON dan bentuk sebagai BLOB (Binary Large Object)
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      // 3. Simulasikan klik pada elemen link <a> untuk mengunduh otomatis
      const a = document.createElement('a');
      a.href = url;
      
      // 4. Buat nama file rapi tanpa karakter aneh
      const safeTitle = data.lesson.title.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
      a.download = `lesson_${lessonId}_${safeTitle}.json`;
      
      document.body.appendChild(a);
      a.click();
      
      // 5. Bersihkan link
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showToast('Data berhasil didownload! Siap dipakai untuk prompt Gemini.', 'success');
    } catch (e) {
      showToast(e.message || 'Gagal mengekspor data', 'error');
    } finally {
      btn.innerHTML = originalHtml;
      btn.disabled = false;
    }
  }));
}

function openContentForm(type, cfg, lessons, existing) {
  const isEdit = !!existing;
  let initialQuillContent = '';
  
  if (existing) {
    if (type === 'vocabulary') {
      initialQuillContent = [
        existing.word || '',
        existing.reading || '',
        existing.meaning || '',
        existing.example_sentence || '',
        existing.example_translation || ''
      ].filter(Boolean).join('<br>');
    } else if (type === 'kanji') {
      initialQuillContent = [
        existing.character || '',
        existing.onyomi || '',
        existing.meaning || '',
        existing.example_word || '',
        existing.example_reading || ''
      ].filter(Boolean).join('<br>');
    } else if (type === 'grammar') {
      initialQuillContent = existing.explanation || '';
    }
  }

  openModal(isEdit ? `Edit ${cfg.label}` : `${cfg.label} Baru`, `
    <form id="ctForm" class="space-y-4">
      <div><label class="field-label">Lesson *</label>
        <select name="lesson_id" required class="field-input">${lessonSelectOptions(lessons, existing ? existing.lesson_id : contentFilterLesson[type])}</select>
      </div>
      ${type === 'grammar' ? `
        <div><label class="field-label">Pattern *</label><input name="pattern" type="text" required class="field-input" value="${existing ? escapeHtml(existing.pattern||'') : ''}"></div>
        <div><label class="field-label">Meaning *</label><input name="meaning" type="text" required class="field-input" value="${existing ? escapeHtml(existing.meaning||'') : ''}"></div>
        <div>
          <label class="field-label">Explanation & Contoh Kalimat (Rich Editor) *</label>
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden">
            <div id="quillContent">${initialQuillContent}</div>
          </div>
        </div>
      ` : type === 'vocabulary' ? `
        <div>
          <label class="field-label">Input Vocabulary (Tekan Enter untuk baris baru) *</label>
          <p class="text-xs text-slate-400 mb-1.5">Baris 1: Word | Baris 2: Reading | Baris 3: Meaning | Baris 4: Example Sentence | Baris 5: Example Translation</p>
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden">
            <div id="quillContent">${initialQuillContent}</div>
          </div>
        </div>
      ` : `
        <div>
          <label class="field-label">Input Kanji (Tekan Enter untuk baris baru) *</label>
          <p class="text-xs text-slate-400 mb-1.5">Baris 1: Character ( ) | Baris 2: Reading ( ) | Baris 3: Meaning (Membaca) | Baris 4: Example Word/Sentence ( ) | Baris 5: Example Reading/Translation (Membaca buku)</p>
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden">
            <div id="quillContent">${initialQuillContent}</div>
          </div>
        </div>
      `}
      <button type="submit" class="w-full rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-semibold py-2.5 shadow-soft transition">${isEdit ? 'Simpan Perubahan' : 'Simpan'}</button>
      <button type="button" onclick="closeModal()" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 font-semibold py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700 transition">Tutup</button>
    </form>`);

  activeContentQuill = new Quill('#quillContent', {
    theme: 'snow',
    placeholder: type === 'grammar' ? 'Tulis penjelasan grammar...' : 'Ketik baris per baris...',
    modules: { toolbar: type === 'grammar' ? [
      [{ header: [1,2,3,false] }], ['bold','italic','underline','strike'],
      [{ list:'ordered' }, { list:'bullet' }], ['blockquote','code-block','link'],
      [{ align: [] }], ['clean'],
    ] : false },
  });

  const form = document.getElementById('ctForm');
  const submitBtn = form.querySelector('button[type=submit]');
  
  form.addEventListener('submit', guardSubmit(submitBtn, async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = { lesson_id: fd.get('lesson_id') };
    
    if (type === 'grammar') {
      payload.pattern = fd.get('pattern').trim();
      payload.meaning = fd.get('meaning').trim();
      payload.explanation = activeContentQuill ? activeContentQuill.root.innerHTML : null;
    } else if (type === 'vocabulary') {
      const text = activeContentQuill.getText();
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      payload.word = lines[0] || '';
      payload.reading = lines[1] || '';
      payload.meaning = lines[2] || '';
      payload.example_sentence = lines[3] || '';
      payload.example_translation = lines[4] || '';
      if (!payload.word || !payload.meaning) {
        showToast('Word dan Meaning wajib diisi (minimal baris 1 dan 3)', 'warning');
        return;
      }
    } else if (type === 'kanji') {
      const text = activeContentQuill.getText();
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      payload.character = lines[0] || '';
      payload.onyomi = lines[1] || '';
      payload.meaning = lines[2] || '';
      payload.example_word = lines[3] || '';
      payload.example_reading = lines[4] || '';
      payload.kunyomi = null;
      payload.example_sentence = null;
      if (!payload.character || !payload.meaning) {
        showToast('Character dan Meaning wajib diisi', 'warning');
        return;
      }
    }

    try {
      if (isEdit) await api(`/${type}/${existing.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      else await api(`/${type}`, { method: 'POST', body: JSON.stringify(payload) });
      showToast(isEdit ? `${cfg.label} berhasil diperbarui` : `${cfg.label} berhasil ditambahkan`, 'success');
      closeModal();
      contentFilterLesson[type] = payload.lesson_id;
      renderSection(type);
    } catch (err) { showToast(err.message, 'error'); }
  }));
}

          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
              <span class="badge bg-primary-50 dark:bg-primary-900/40 text-primary-600 dark:text-primary-300">${q.content_type}</span>
              <span class="badge bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">${questionTypeLabel(q.question_type)}</span>
              <span class="badge bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400">${q.difficulty}</span>
              <span class="badge bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400">${q.points} pts</span>
            </div>
            <p class="text-sm font-medium">${escapeHtml(q.question_text)}</p>
            <p class="text-xs text-slate-400 mt-1">Jawaban benar: <span class="font-bold uppercase">${q.correct_answer}</span></p>
          </div>
          <div class="flex gap-1 shrink-0">
            <button data-edit="${q.id}" aria-label="Edit" class="h-8 w-8 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300"><i class="fa-solid fa-pen text-xs"></i></button>
            <button data-del="${q.id}" aria-label="Hapus" class="h-8 w-8 rounded-lg bg-rose-50 dark:bg-rose-950/40 flex items-center justify-center text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
          </div>
        </div>
      </div>`).join('') : emptyBlock('Lesson ini belum punya question.');
      
    const lessons = await getLessons();
    listEl.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openQuestionForm(lessons, rows.find(r => String(r.id) === btn.dataset.edit))));
    listEl.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
      confirmDelete('Hapus question ini? Riwayat quiz_attempts terkait juga akan terhapus.', async () => {
        await api(`/questions/${btn.dataset.del}`, { method: 'DELETE' });
        showToast('Question berhasil dihapus', 'success');
        loadQuestionsList();
      });
    }));
  } catch (e) { listEl.innerHTML = errorBlock(e.message); }
}

async function refreshContentRefOptions(lessonId, contentType, selectedId) {
  const sel = document.getElementById('qContentRef');
  sel.innerHTML = '<option value="">Memuat...</option>';
  try {
    const rows = await api(`/${contentType}?lesson_id=${lessonId}`);
    const cfg = CONTENT_CONFIGS[contentType];
    sel.innerHTML = rows.length
      ? rows.map(r => `<option value="${r.id}" ${String(r.id)===String(selectedId)?'selected':''}>${escapeHtml(cfg.primary(r))} | ${escapeHtml(cfg.secondary(r))}</option>`).join('')
      : '<option value="">Belum ada data   tambahkan dulu</option>';
  } catch (e) { sel.innerHTML = '<option value="">Gagal memuat</option>'; }
}

function openQuestionForm(lessons, existing) {
  const isEdit = !!existing;
  const lessonId = existing ? existing.lesson_id : questionFilterLesson;
  
  openModal(isEdit ? 'Edit Question' : 'Question Baru', `
    <form id="qForm" class="space-y-4">
      <div><label class="field-label">Lesson *</label>
        <select name="lesson_id" ${isEdit ? 'disabled' : 'required'} class="field-input">${lessonSelectOptions(lessons, lessonId)}</select>
        ${isEdit ? `<input type="hidden" name="lesson_id" value="${lessonId}">` : ''}
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="field-label">Content Type *</label>
          <select id="qContentType" name="content_type" required class="field-input">
            ${['grammar','vocabulary','kanji'].map(t => `<option value="${t}" ${existing && existing.content_type===t?'selected':''}>${CONTENT_CONFIGS[t].label}</option>`).join('')}
          </select>
        </div>
        <div><label class="field-label">Content Reference *</label>
          <select id="qContentRef" name="content_id" required class="field-input"><option>Memuat...</option></select>
        </div>
      </div>
      <div><label class="field-label">Question Type *</label>
        <select name="question_type" required class="field-input">${QUESTION_TYPES.map(t => `<option value="${t}" ${existing && existing.question_type===t?'selected':''}>${questionTypeLabel(t)}</option>`).join('')}</select>
      </div>
      <div><label class="field-label">Question Text *</label><textarea name="question_text" rows="2" required class="field-input">${existing ? escapeHtml(existing.question_text) : ''}</textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="field-label">Option A *</label><input name="option_a" required class="field-input" value="${existing ? escapeHtml(existing.option_a) : ''}"></div>
        <div><label class="field-label">Option B *</label><input name="option_b" required class="field-input" value="${existing ? escapeHtml(existing.option_b) : ''}"></div>
        <div><label class="field-label">Option C *</label><input name="option_c" required class="field-input" value="${existing ? escapeHtml(existing.option_c) : ''}"></div>
        <div><label class="field-label">Option D *</label><input name="option_d" required class="field-input" value="${existing ? escapeHtml(existing.option_d) : ''}"></div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="field-label">Correct Answer *</label>
          <select name="correct_answer" required class="field-input">${['a','b','c','d'].map(k => `<option value="${k}" ${existing && existing.correct_answer===k?'selected':''}>${k.toUpperCase()}</option>`).join('')}</select>
        </div>
        <div><label class="field-label">Difficulty *</label>
          <select name="difficulty" required class="field-input">${DIFFICULTIES.map(d => `<option value="${d}" ${existing && existing.difficulty===d?'selected':''}>${d}</option>`).join('')}</select>
        </div>
        <div><label class="field-label">Points</label><input name="points" type="number" min="1" class="field-input" value="${existing ? existing.points : 10}"></div>
      </div>
      <div><label class="field-label">Explanation *</label><textarea name="explanation" rows="2" required class="field-input">${existing ? escapeHtml(existing.explanation) : ''}</textarea></div>
      <button type="submit" class="w-full rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-semibold py-2.5 shadow-soft transition">${isEdit ? 'Simpan Perubahan' : 'Simpan'}</button>
      <button type="button" onclick="closeModal()" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 font-semibold py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700 transition">Tutup</button>
    </form>`);

  const form = document.getElementById('qForm');
  const lessonSelectEl = form.querySelector('select[name=lesson_id]:not([disabled])') || { value: lessonId };
  const typeSelect = document.getElementById('qContentType');
  
  refreshContentRefOptions(lessonId, typeSelect.value, existing ? existing.content_id : null);
  
  typeSelect.addEventListener('change', () => refreshContentRefOptions(lessonSelectEl.value || lessonId, typeSelect.value, null));
  if (!isEdit) {
    form.querySelector('select[name=lesson_id]').addEventListener('change', (e) => refreshContentRefOptions(e.target.value, typeSelect.value, null));
  }

  const submitBtn = form.querySelector('button[type=submit]');
  form.addEventListener('submit', guardSubmit(submitBtn, async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = {
      lesson_id: fd.get('lesson_id'), content_type: fd.get('content_type'), content_id: fd.get('content_id'),
      question_type: fd.get('question_type'), question_text: fd.get('question_text').trim(),
      option_a: fd.get('option_a').trim(), option_b: fd.get('option_b').trim(), option_c: fd.get('option_c').trim(), option_d: fd.get('option_d').trim(),
      correct_answer: fd.get('correct_answer'), difficulty: fd.get('difficulty'), explanation: fd.get('explanation').trim(),
      points: Number(fd.get('points')) || 10,
    };
    if (!payload.content_id) { showToast('Content reference wajib dipilih', 'warning'); return; }
    
    try {
      if (isEdit) await api(`/questions/${existing.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      else await api('/questions', { method: 'POST', body: JSON.stringify(payload) });
      showToast(isEdit ? 'Question berhasil diperbarui' : 'Question berhasil ditambahkan', 'success');
      closeModal();
      questionFilterLesson = payload.lesson_id;
      renderSection('questions');
    } catch (err) { showToast(err.message + (err.details ? ': ' + (Array.isArray(err.details) ? err.details.join(', ') : '') : ''), 'error'); }
  }));
}

// =========================================================
// QUESTION IMPORT
// =========================================================
let importState = { lessonId: null, parsed: null, validation: null };

async function renderImport(el) {
  const lessons = await getLessons();
  if (!importState.lessonId && lessons.length) importState.lessonId = lessons[0].id;
  
  el.innerHTML = `
    <h2 class="font-display font-bold text-xl mb-1">Import Questions</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Alur: <strong>Copy JSON dari Gemini -> Paste -> Validate -> Preview -> Import</strong>.</p>
    <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 sm:p-5 space-y-4">
      <div><label class="field-label">Lesson Tujuan *</label>
        <select id="impLesson" class="field-input" ${lessons.length ? '' : 'disabled'}>${lessons.length ? lessonSelectOptions(lessons, importState.lessonId) : '<option>Belum ada lesson</option>'}</select>
      </div>
      <div>
        <label class="field-label">Paste JSON Question</label>
        <textarea id="impJson" rows="10" class="field-input font-mono text-xs" placeholder='[{"content_type":"vocabulary","content_reference":"...","question_type":"vocabulary_meaning","question_text":"...","option_a":"...","option_b":"...","option_c":"...","option_d":"...","correct_answer":"b","explanation":"...","difficulty":"medium","points":10}]'>${importState.rawJson || ''}</textarea>
      </div>
      <button id="impValidateBtn" ${lessons.length ? '' : 'disabled'} class="rounded-xl bg-primary-500 hover:bg-primary-600 disabled:opacity-50 text-white text-sm font-semibold px-4 py-2.5 shadow-softer transition"><i class="fa-solid fa-magnifying-glass"></i> Validate & Preview</button>
    </div>
    <div id="impPreview" class="mt-6"></div>`;
    
  if (!lessons.length) return;
  document.getElementById('impLesson').addEventListener('change', (e) => { importState.lessonId = e.target.value; });
  
  const validateBtn = document.getElementById('impValidateBtn');
  validateBtn.addEventListener('click', guardSubmit(validateBtn, async () => {
    const raw = document.getElementById('impJson').value.trim();
    importState.rawJson = raw;
    if (!raw) { showToast('Paste JSON terlebih dahulu', 'warning'); return; }
    
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { showToast('JSON tidak valid: ' + e.message, 'error'); return; }
    if (!Array.isArray(parsed)) { showToast('JSON harus berupa array of question', 'error'); return; }
    
    importState.parsed = parsed;
    try {
      const result = await api('/questions/validate-import', { method: 'POST', body: JSON.stringify({ lesson_id: importState.lessonId, questions: parsed }) });
      importState.validation = result;
      renderImportPreview();
    } catch (e) { showToast(e.message, 'error'); }
  }));
}

function renderImportPreview() {
  const r = importState.validation;
  const el = document.getElementById('impPreview');
  el.innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      <span class="badge bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">Total ${r.total}</span>
      <span class="badge bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400">Valid ${r.valid_count}</span>
      <span class="badge bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400">Invalid ${r.invalid_count}</span>
    </div>
    <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
      ${r.results.map(item => `
        <div class="rounded-xl p-3 border ${item.valid ? 'border-emerald-200 dark:border-emerald-900 bg-emerald-50/50 dark:bg-emerald-950/20' : 'border-rose-200 dark:border-rose-900 bg-rose-50/50 dark:bg-rose-950/20'}">
          <p class="text-sm font-semibold mb-1">#${item.index + 1} ${item.valid ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : '<i class="fa-solid fa-circle-xmark text-rose-500"></i>'}</p>
          ${item.valid
            ? `<p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(item.resolved.question_text)}</p>`
            : `<ul class="text-xs text-rose-600 dark:text-rose-400 list-disc pl-4">${item.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`}
        </div>`).join('')}
    </div>
    <button id="impConfirmBtn" ${r.can_import ? '' : 'disabled'} class="mt-4 w-full rounded-xl bg-primary-500 hover:bg-primary-600 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold py-3 shadow-soft transition">
      <i class="fa-solid fa-file-import"></i> ${r.can_import ? `Import ${r.valid_count} Question` : 'Perbaiki question yang invalid terlebih dahulu'}
    </button>`;
    
  if (r.can_import) {
    const btn = document.getElementById('impConfirmBtn');
    btn.addEventListener('click', guardSubmit(btn, async () => {
      try {
        const res = await api('/questions/import', { method: 'POST', body: JSON.stringify({ lesson_id: importState.lessonId, questions: importState.parsed, confirm: true }) });
        showToast(`${res.imported_count} question berhasil diimport`, 'success');
        importState = { lessonId: importState.lessonId, parsed: null, validation: null, rawJson: '' };
        renderSection('import');
      } catch (e) { showToast(e.message, 'error'); }
    }));
  }
}

// =========================================================
// STATISTICS
// =========================================================
let statsSubTab = 'overview';

async function renderStatistics(el) {
  el.innerHTML = `
    <h2 class="font-display font-bold text-xl mb-4">Statistics</h2>
    <div class="flex gap-1 border-b border-slate-200 dark:border-slate-700 mb-5 overflow-x-auto">
      ${['overview','grammar','vocabulary','kanji','mistakes'].map(t => `
        <button data-tab="${t}" class="stats-subtab px-4 py-2 text-sm font-semibold border-b-2 ${t===statsSubTab?'subtab-active':'border-transparent text-slate-400'} whitespace-nowrap transition">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
    <div id="statsBody">${loadingSkeleton()}</div>`;
    
  document.querySelectorAll('.stats-subtab').forEach(btn => btn.addEventListener('click', () => { statsSubTab = btn.dataset.tab; renderStatistics(document.getElementById('sectionContent')); }));
  const body = document.getElementById('statsBody');
  
  try {
    if (statsSubTab === 'overview') await renderStatsOverview(body);
    else if (statsSubTab === 'mistakes') await renderStatsMistakes(body);
    else await renderStatsContentType(body, statsSubTab);
  } catch (e) { body.innerHTML = errorBlock(e.message); }
}

async function renderStatsOverview(body) {
  const s = await api('/statistics');
  body.innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4"><p class="text-xs text-slate-400 mb-1">Overall Accuracy</p><p class="font-display text-2xl font-bold text-primary-600 dark:text-primary-400">${s.overall_accuracy}%</p></div>
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4"><p class="text-xs text-slate-400 mb-1">Questions Answered</p><p class="font-display text-2xl font-bold">${s.total_questions}</p></div>
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4"><p class="text-xs text-slate-400 mb-1">Lessons</p><p class="font-display text-2xl font-bold">${s.total_lessons}</p></div>
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4"><p class="text-xs text-slate-400 mb-1">Avg Mastery</p><p class="font-display text-2xl font-bold text-emerald-500">${Math.round(s.avg_mastery*100)}%</p></div>
    </div>
    <h3 class="font-display font-bold mb-3">Breakdown per Content Type</h3>
    <div class="grid grid-cols-3 gap-3 mb-6">
      ${['grammar','vocabulary','kanji'].map(t => `
        <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-softer p-4 text-center">
          <p class="text-[11px] uppercase tracking-wide text-slate-400 mb-1">${t}</p>
          <p class="font-display text-xl font-bold ${s.breakdown[t].accuracy===null?'text-slate-300 dark:text-slate-600':'text-primary-600 dark:text-primary-400'}">${s.breakdown[t].accuracy===null?'-':s.breakdown[t].accuracy+'%'}</p>
          <p class="text-[11px] text-slate-400 mt-0.5">${s.breakdown[t].correct}/${s.breakdown[t].total}</p>
        </div>`).join('')}
    </div>
    <div class="grid sm:grid-cols-2 gap-6">
      <div>
        <h3 class="font-display font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Weak Areas</h3>
        <div class="space-y-2">${s.weak_areas.length ? s.weak_areas.map(w => statPill(w,'amber')).join('') : emptyBlock('Belum cukup data', 'fa-chart-simple')}</div>
      </div>
      <div>
        <h3 class="font-display font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-star text-emerald-500"></i> Strong Areas</h3>
        <div class="space-y-2">${s.strong_areas.length ? s.strong_areas.map(w => statPill(w,'emerald')).join('') : emptyBlock('Belum cukup data', 'fa-chart-simple')}</div>
      </div>
    </div>`;
}

function statPill(w, color) {
  return `<div class="rounded-xl bg-white dark:bg-slate-800 shadow-softer p-3 flex items-center justify-between">
    <span class="text-sm font-medium">${escapeHtml(w.label)}</span>
    <span class="font-display font-bold text-${color}-500">${w.accuracy}%</span>
  </div>`;
}

async function renderStatsContentType(body, type) {
  const rows = await api(`/statistics/${type}`);
  const cfg = CONTENT_CONFIGS[type];
  body.innerHTML = rows.length ? `
    <div class="space-y-2">
      ${rows.map(r => `
        <div class="rounded-xl bg-white dark:bg-slate-800 shadow-softer p-3.5 flex items-center justify-between gap-3">
          <div class="min-w-0">
            <p class="font-semibold text-sm">${escapeHtml(r.label)}</p>
            <p class="text-xs text-slate-400">${r.correct_count} benar | ${r.wrong_count} salah</p>
          </div>
          <div class="text-right shrink-0">
            <p class="font-display font-bold ${Number(r.accuracy) >= 70 ? 'text-emerald-500' : Number(r.accuracy) > 0 ? 'text-amber-500' : 'text-slate-300 dark:text-slate-600'}">${Math.round(Number(r.accuracy))}%</p>
            <p class="text-[10px] text-slate-400">mastery ${Math.round(Number(r.mastery_score)*100)}%</p>
          </div>
        </div>`).join('')}
    </div>` : emptyBlock(`Belum ada data ${cfg.label.toLowerCase()} yang pernah diuji.`);
}

async function renderStatsMistakes(body) {
  const rows = await api('/mistakes');
  body.innerHTML = rows.length ? `
    <div class="space-y-2">
      ${rows.map(m => `
        <div class="rounded-xl bg-white dark:bg-slate-800 shadow-softer p-3.5" data-id="${m.id}">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <p class="text-xs text-slate-400 mb-1">${escapeHtml(m.lesson_title)} | ${m.mistake_type}</p>
              <p class="text-sm font-medium">${escapeHtml(m.question_text)}</p>
              <p class="text-xs text-rose-500 mt-1">Salah: ${m.wrong_answer.toUpperCase()} | Benar: ${m.correct_answer.toUpperCase()}${m.content_label ? ` | ${escapeHtml(m.content_label)}` : ''}</p>
            </div>
            <button data-del="${m.id}" aria-label="Hapus" class="h-8 w-8 rounded-lg bg-rose-50 dark:bg-rose-950/40 flex items-center justify-center text-rose-500 shrink-0"><i class="fa-solid fa-trash text-xs"></i></button>
          </div>
        </div>`).join('')}
    </div>` : emptyBlock('Belum ada kesalahan tercatat. Kerja bagus!', 'fa-face-smile');
    
  body.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
    confirmDelete('Hapus catatan kesalahan ini?', async () => {
      await api(`/mistakes/${btn.dataset.del}`, { method: 'DELETE' });
      showToast('Catatan mistake dihapus', 'success');
      renderStatsMistakes(body);
    });
  }));
}

async function init() {
  try { await api('/auth/me'); } catch (e) { return; }
  const s = currentSection();
  renderTabs(s);
  renderSection(s);
}
init();
